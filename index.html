<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#131921">
  <title>AAYUSH SHOPPING</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">🛍️ AAYUSH <span>SHOPPING</span></div>
    <button class="cart-button" id="cartButton">Cart <b id="cartCount">0</b></button>
  </header>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search products..." aria-label="Search products">
  </div>
  <nav id="categories" class="categories" aria-label="Product categories"></nav>
  <main>
    <section class="hero">
      <p class="eyebrow">WELCOME TO AAYUSH SHOPPING</p>
      <h1>Find something<br>you’ll love.</h1>
      <p>Explore products across everyday categories.</p>
      <span class="demo-tag">DEMO STORE · NO REAL PAYMENTS</span>
    </section>
    <div class="section-heading">
      <h2 id="sectionTitle">Popular products</h2>
      <span id="resultCount"></span>
    </div>
    <section id="products" class="products" aria-live="polite"></section>
  </main>
  <div id="cartPanel" class="cart-panel" aria-label="Shopping cart" hidden>
    <div class="cart-head"><h2>Your cart</h2><button id="closeCart" aria-label="Close cart">✕</button></div>
    <div id="cartItems"></div>
    <div class="cart-foot"><strong id="cartTotal">Total: $0.00</strong><p>Demo only. Checkout and payments are not enabled.</p></div>
  </div>
  <footer>© <span id="year"></span> AAYUSH SHOPPING · Demo storefront</footer>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
